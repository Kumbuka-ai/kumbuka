name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on a branch/PR, but never cancel a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Required check (branch protection). Internal links are now hard-gated by the
  # `Build docs site` job (starlight-links-validator). This job stays as the
  # external-link rot reporter — report-only so transient 5xx/rate-limits don't
  # turn the build red; results land in the job summary.
  links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links (report only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --max-retries 3
            --retry-wait-time 5
            --accept 200,206,429
            --exclude '^/'
            './**/*.md'
          fail: false
          jobSummary: true

  # The build IS the gate: starlight-links-validator fails the build on a broken
  # internal link or missing heading anchor, and Astro fails on bad content.
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (validates internal links + content)
        run: pnpm run build

  # Lax style lint on the hand-authored root prose files only.
  markdownlint:
    name: Lint Markdown style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          config: '.markdownlint.json'
          globs: '*.md'
